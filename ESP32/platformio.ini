; Firmware ESP32-C3 Super Mini (co OLED 0.42" 72x40) cho khoa cua van tay (BTL He thong nhung)
; Buoc 9c-1: lien ket UART voi STM32, luu log vao LittleFS, WiFi + NTP, hien trang thai len OLED.
[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ESP32-C3 Super Mini: flash 4MB, dung che do DIO cho chac (mot so lo khong chay QIO)
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv
board_build.filesystem = littlefs

; In log qua cong USB-C (Serial Monitor) thay vi UART0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Thu vien man hinh OLED (PlatformIO tu tai ve khi build lan dau)
lib_deps =
    olikraus/U8g2

monitor_speed = 115200
; USB noi thang vao chip: khong de Serial Monitor dieu khien DTR/RTS (tranh reset / ket che do nap).
; Muon xem lai tu dau: nhan nut RST tren board.
monitor_dtr = 0
monitor_rts = 0
